name: Publish gem

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: rubygems-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'PostCo/sendcloud_api'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require released source to be merged
        run: git merge-base --is-ancestor HEAD origin/main

      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Check release tag matches gem version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          bundle exec ruby -Ilib -rsendcloud_api/version <<'RUBY'
          version = SendcloudAPI::VERSION
          abort "Release tag must match v#{version}" unless ENV.fetch("RELEASE_TAG") == "v#{version}"
          abort "Invalid gem version" unless /\A\d+\.\d+\.\d+(?:\.[a-zA-Z0-9]+)*\z/.match?(version)
          File.open(ENV.fetch("GITHUB_OUTPUT"), "a") { |file| file.puts "gem_path=pkg/sendcloud_api-#{version}.gem" }
          RUBY

      - name: Test and lint
        run: bundle exec rake

      - name: Build gem
        run: bundle exec rake build

      - name: Authenticate to RubyGems with GitHub OIDC
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Publish the tested version
        env:
          GEM_PATH_TO_PUSH: ${{ steps.version.outputs.gem_path }}
        run: gem push "$GEM_PATH_TO_PUSH" --host https://rubygems.org
