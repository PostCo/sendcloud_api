name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubicloud-standard-2
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "3.3"
          - "3.4"

    name: Ruby ${{ matrix.ruby }}

    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake
      - run: gem build sendcloud_api.gemspec
